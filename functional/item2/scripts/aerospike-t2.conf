# Aerospike CE for work item 2 (storage tests). A private node so the tests
# never touch aerospike-ce on 127.0.0.1:3000. Memory-backed; nsup runs every
# 10 s and default-ttl is non-zero so T-STO-07 can tell "namespace default"
# from "no TTL".
service {
    proto-fd-max 15000
    cluster-name lmcache-item2
}
logging {
    console {
        context any info
    }
}
network {
    service {
        address 127.0.0.1
        port 3200
        access-address 127.0.0.1
        access-port 3200
    }
    heartbeat {
        mode mesh
        address 127.0.0.1
        port 3202
        interval 150
        timeout 10
    }
    fabric {
        address 127.0.0.1
        port 3201
    }
}
namespace lmcache {
    replication-factor 1
    nsup-period 10
    default-ttl 7200
    max-record-size 1048576
    storage-engine memory {
        data-size 8G
    }
}
# T-EVT-01: a small namespace that evicts. nsup runs every 2 s and evicts
# the soonest-expiring records once memory use passes 50%; writes stop
# only at 90%, so a writer outpacing eviction still mostly succeeds.
namespace lmcache_evict {
    replication-factor 1
    nsup-period 2
    default-ttl 3600
    # Evict up to 20% per nsup cycle: the test stores whole rounds of
    # records with one void-time, and nsup skips a bucket larger than this.
    evict-tenths-pct 200
    max-record-size 1048576
    storage-engine memory {
        data-size 512M
        evict-used-pct 50
        stop-writes-used-pct 90
    }
}
