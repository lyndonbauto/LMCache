# Aerospike CE for the functional tests (based on tests/aerospike_ce.conf.template).
# The lmcache namespace uses a file-backed device. The 5 TiB scratch disk
# (/dev/vdc1) is not mounted, so the file lives on the boot disk.
service {
    proto-fd-max 15000
    cluster-name lmcache-functional
}
logging {
    console {
        context any info
    }
}
network {
    service {
        address 127.0.0.1
        port 3000
        access-address 127.0.0.1
        access-port 3000
    }
    heartbeat {
        mode mesh
        address 127.0.0.1
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address 127.0.0.1
        port 3001
    }
    info {
        address 127.0.0.1
        port 3003
    }
}
namespace lmcache {
    replication-factor 1
    nsup-period 120
    default-ttl 0
    max-record-size 1048576
    storage-engine device {
        file /opt/aerospike/data/lmcache.dat
        filesize 256G
        max-write-cache 2G
    }
}
namespace lmcache_no_nsup {
    replication-factor 1
    nsup-period 0
    default-ttl 0
    max-record-size 1048576
    storage-engine memory {
        data-size 512M
    }
}
