# Aerospike kv-sink server (sriram/kv-sink-batch-prio, 046e8558d) for the new
# kv-sink stack: batch-read rows carry a sink field and the server RDMA-writes
# each value into the client's registered window before answering the row.
# Runs beside aerospike-ce (3000-3003) and the old kv-sink server (3100-3103),
# so every port is 3700-3703 and every address is 127.0.0.1.
#
# The transport is chosen per sink by the client (RC here; Soft-RoCE has no
# SRD). The server's device and GID come from the environment, not this file:
#   KV_SINK_RDMA_DEVICE=rxe0 KV_SINK_GID_INDEX=1
# (GID 0 on rxe0 is the link-local IPv6 GID, which RC over lo cannot reach).
# The same-host "local" transport stays off unless KV_SINK_ENABLE_LOCAL=1.
service {
    proto-fd-max 15000
    cluster-name lmcache-kvsink-bp
    work-directory /root/lmc-work/aerospike-kvsink-bp-data/work
}
logging {
    console {
        context any info
    }
}
mod-lua {
    user-path /root/lmc-work/aerospike-kvsink-bp-data/work/usr/udf/lua
    allow-unsafe-lua false
}
network {
    service {
        address 127.0.0.1
        port 3700
        access-address 127.0.0.1
        access-port 3700
    }
    heartbeat {
        mode mesh
        address 127.0.0.1
        port 3702
        interval 150
        timeout 10
    }
    fabric {
        address 127.0.0.1
        port 3701
    }
    admin {
        address 127.0.0.1
        port 3703
    }
}
# kv-sink sends values straight from the namespace's memory stripes, so the
# namespace must use storage-engine memory and must not be strong-consistency
# (the server refuses sink reads there). memlock must be unlimited in the
# container, since stripes are pinned with ibv_reg_mr.
namespace lmcache {
    replication-factor 1
    nsup-period 120
    default-ttl 0
    max-record-size 1048576
    stop-writes-sys-memory-pct 100
    storage-engine memory {
        # 16G as the old server's config: Stage 3's e2e04 short group stores
        # about 6 GB of Llama chunks and filled 8G (AEROSPIKE_ERR_SERVER_FULL).
        data-size 16G
    }
}
# For the storage integrity suite's eviction test (AEROSPIKE_TEST_EVICT_NAMESPACE),
# as in functional/d14/scripts/aerospike-d14.conf.
namespace lmcache_evict {
    replication-factor 1
    nsup-period 2
    default-ttl 3600
    evict-tenths-pct 200
    max-record-size 1048576
    storage-engine memory {
        data-size 512M
        evict-used-pct 50
        stop-writes-used-pct 90
    }
}
