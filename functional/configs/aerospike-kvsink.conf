# Aerospike kv-sink server (feat/kv-sink-fetch-pipelined) for Stage 3.
# Runs beside aerospike-ce (3000-3003), so every port is 3100-3103 and every
# address is 127.0.0.1. kv-sink has no config switch: the four kv-sink info
# commands are always on. The RDMA device is the first verbs device the
# process sees (rxe0 in aero-kvsink) and the RC GID index is fixed at 1
# (server issue 6).
service {
    proto-fd-max 15000
    cluster-name lmcache-kvsink
    work-directory /root/lmc-work/aerospike-kvsink-data/work
}
logging {
    console {
        context any info
    }
}
mod-lua {
    user-path /root/lmc-work/aerospike-kvsink-data/work/usr/udf/lua
    allow-unsafe-lua false
}
network {
    service {
        address 127.0.0.1
        port 3100
        access-address 127.0.0.1
        access-port 3100
    }
    heartbeat {
        mode mesh
        address 127.0.0.1
        port 3102
        interval 150
        timeout 10
    }
    fabric {
        address 127.0.0.1
        port 3101
    }
    # This build ignores an info stanza ("obsolete") and wants admin instead.
    admin {
        address 127.0.0.1
        port 3103
    }
}
# kv-sink writes straight from the namespace's memory stripes (zero copy), so
# the namespace must use storage-engine memory. Each stripe is registered
# with ibv_reg_mr on its first fetch (server issue 5), which pins it: memlock
# must be unlimited in the container.
namespace lmcache {
    replication-factor 1
    nsup-period 120
    default-ttl 0
    max-record-size 1048576
    storage-engine memory {
        data-size 16G
    }
}
