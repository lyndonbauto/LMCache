# Aerospike kv-sink server (sriram/kv-sink-batch-prio, 046e8558d) for T-E2E-11
# (Stage 6 GPU, Llama-3.3-70B at TP=1): aerospike-kvsink-bp.conf with a 64G
# namespace, same ports (3700-3703) and work directory, so it replaces that
# server for the 70B group (stage6gpu.sh e2e11 sets KVSINK_CONF_FILE) and the
# section restarts the 16G one afterwards.
# A 70B chunk is 80 MiB (80 layers x K and V x 8 heads x 128 x 256 tokens x
# bf16); P-exact + P-ragged + P-shared store 552 + 8 chunks = 43.8 GiB, which
# would fill the 16G namespace (SERVER_FULL, as Stage 3's 8G one did).
# One node, not three (the ledger's old "three kv-sink processes" was E4's
# 3-node cluster layout): three processes would form a cluster, LMCache
# refuses pipelined plans on a multi-node cluster (N1), and one adapter cannot
# spread keys over three single-node clusters. Capacity is the only reason to
# grow, and one node's namespace size covers it.
#
# The transport is chosen per sink by the client (RC here; Soft-RoCE has no
# SRD). The server's device and GID come from the environment, not this file:
#   KV_SINK_RDMA_DEVICE=rxe0 KV_SINK_GID_INDEX=1
service {
    proto-fd-max 15000
    cluster-name lmcache-kvsink-bp
    work-directory /root/lmc-work/aerospike-kvsink-bp-data/work
}
logging {
    console {
        context any info
    }
}
mod-lua {
    user-path /root/lmc-work/aerospike-kvsink-bp-data/work/usr/udf/lua
    allow-unsafe-lua false
}
network {
    service {
        address 127.0.0.1
        port 3700
        access-address 127.0.0.1
        access-port 3700
    }
    heartbeat {
        mode mesh
        address 127.0.0.1
        port 3702
        interval 150
        timeout 10
    }
    fabric {
        address 127.0.0.1
        port 3701
    }
    admin {
        address 127.0.0.1
        port 3703
    }
}
# kv-sink sends values straight from the namespace's memory stripes, so the
# namespace must use storage-engine memory and must not be strong-consistency
# (the server refuses sink reads there). memlock must be unlimited in the
# container, since stripes are pinned with ibv_reg_mr.
namespace lmcache {
    replication-factor 1
    nsup-period 120
    default-ttl 0
    max-record-size 1048576
    stop-writes-sys-memory-pct 100
    storage-engine memory {
        data-size 64G
    }
}
# For the storage integrity suite's eviction test (AEROSPIKE_TEST_EVICT_NAMESPACE),
# as in functional/d14/scripts/aerospike-d14.conf.
namespace lmcache_evict {
    replication-factor 1
    nsup-period 2
    default-ttl 3600
    evict-tenths-pct 200
    max-record-size 1048576
    storage-engine memory {
        data-size 512M
        evict-used-pct 50
        stop-writes-used-pct 90
    }
}
