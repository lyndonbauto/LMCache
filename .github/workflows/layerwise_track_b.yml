name: Track B layerwise (CPU)

# Fast, focused CI for the layerwise consumption workstream (Track B).
#
# What this covers: the CPU-testable logic of Track B -- the frozen contract,
# the arrival pump, the fakes, the multiprocess sink shape, and the per-layer
# schedule / progress bookkeeping. These run on standard GitHub-hosted Ubuntu
# runners, which have no GPU, so anything marked `cuda` is excluded here.
#
# What this does NOT cover: the real GPU per-layer overlap
# (tests/v1/multiprocess/test_layerwise_gpu_overlap.py, marked `cuda`) and the
# cross-process CUDA IPC handoff. Those need a native-Linux GPU runner; see the
# `track-b-gpu` job below, which stays dormant until a self-hosted GPU runner
# labelled `[self-hosted, linux, gpu]` is registered.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lmcache/v1/layerwise/**"
      - "lmcache/v1/multiprocess/layerwise_sink.py"
      - "lmcache/v1/multiprocess/layer_progress.py"
      - "lmcache/v1/multiprocess/layerwise_schedule.py"
      - "tests/v1/layerwise/**"
      - "tests/v1/multiprocess/test_layer_progress.py"
      - "tests/v1/multiprocess/test_layerwise_schedule.py"
      - "tests/v1/multiprocess/test_layerwise_gpu_overlap.py"
      - "tests/v1/multiprocess/test_object_group_layerwise_transfer.py"
      - "tests/v1/multiprocess/test_layer_progress_lifetime.py"
      - "lmcache/v1/multiprocess/object_group_transfer.py"
      - "lmcache/v1/multiprocess/transfer_context/worker_transfer.py"
      - "lmcache/v1/gpu_connector/gpu_ops.py"
      - "benchmarks/layerwise/**"
      - "tests/benchmarks/test_layerwise_simulate_ttft.py"
      - ".github/workflows/layerwise_track_b.yml"

concurrency:
  group: track-b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  track-b-cpu:
    name: "Track B CPU tests (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/requirements/*.txt

      - name: Install dependencies (CPU-only build)
        run: |
          python -m pip install --upgrade pip
          # CPU torch is enough: NO_GPU_EXT below compiles the common C++
          # extension (which provides device_ops) but no GPU backend, so the
          # test-collection import chain in tests/conftest.py succeeds.
          python -m pip install torch==2.13.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/build.txt
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/test.txt
          NO_GPU_EXT=1 python -m pip install -e . --no-build-isolation

      - name: Run Track B CPU tests
        run: |
          pytest -v -m "not (cuda or musa or xpu or npu or neuron)" \
            tests/v1/layerwise \
            tests/v1/multiprocess/test_layer_progress.py \
            tests/v1/multiprocess/test_layer_progress_lifetime.py \
            tests/v1/multiprocess/test_layerwise_schedule.py \
            tests/v1/multiprocess/test_object_group_layerwise_transfer.py \
            tests/v1/multiprocess/test_layerwise_gpu_overlap.py \
            tests/benchmarks/test_layerwise_simulate_ttft.py

  # The real GPU overlap proof. Skipped everywhere until a self-hosted GPU
  # runner exists: GitHub-hosted runners have no GPU, and WSL cannot do the
  # cross-process CUDA IPC the full path relies on. Register a native-Linux
  # box with labels [self-hosted, linux, gpu] to activate it.
  track-b-gpu:
    name: "Track B GPU overlap (self-hosted)"
    if: false # flip to a runner-label check once a GPU runner is registered
    runs-on: [self-hosted, linux, gpu]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies (GPU build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0
          python -m pip install -r requirements/build.txt
          python -m pip install -r requirements/common.txt
          python -m pip install -r requirements/test.txt
          python -m pip install -e . --no-build-isolation

      - name: Run Track B GPU tests
        run: |
          pytest -v -m cuda \
            tests/v1/multiprocess/test_layerwise_gpu_overlap.py \
            tests/v1/multiprocess/test_object_group_layerwise_transfer.py \
            tests/benchmarks/test_layerwise_simulate_ttft.py
          python benchmarks/layerwise/simulate_ttft.py --repeats 5
